<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIOSFER APP</title>
<style>
:root{--g:#0b4a2f;--g2:#15803d;--y:#e1a325;--bg:#f4f6f5;--l:#e8f3ec}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:#1f2d27;display:flex;min-height:100vh;font-size:14px}
#sb{width:260px;background:linear-gradient(#0b3d2a,#115235);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .25s;overflow:hidden;flex-shrink:0}
#sb.c{width:0}#sb>*{min-width:260px}
.br{padding:18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #ffffff22}.br img{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain}.br b{font-size:18px;display:block}.br small{opacity:.8}
#nv{flex:1;overflow:auto;padding:12px}#nv a{display:block;padding:11px 14px;border-radius:10px;color:#fff;cursor:pointer;font-weight:600;margin-bottom:3px}#nv a:hover{background:#ffffff18}#nv a.on{background:var(--y)}
.ft{padding:10px 18px;border-top:1px solid #ffffff22;font-size:13px}.ft a{display:block;color:#ffb4a0;font-weight:700;cursor:pointer;padding:6px 0}.ft small{opacity:.7;display:block;margin-bottom:6px}
#mw{flex:1;min-width:0}#tp{background:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e3e8e5;position:sticky;top:0;z-index:5}
#tg{background:var(--y);border:0;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:#fff}#bc{flex:1;color:#667}#bc b{color:#111}
.us{background:#f1f5f3;border-radius:30px;padding:6px 14px;display:flex;gap:8px;align-items:center}.us select{border:0;background:none;font-weight:700;color:var(--g2)}
#bell{position:relative;cursor:pointer;font-size:20px;background:none;border:0}#bell i{position:absolute;top:-4px;right:-6px;background:#d33;color:#fff;font-size:11px;border-radius:10px;padding:1px 5px;font-style:normal}
#mn{padding:24px;max-width:1400px}.cd{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 4px #0001;margin-bottom:20px}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}.hd h3{margin:0;color:var(--g);font-size:18px}.hd>div{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gr{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:14px}.gr.w{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
label{display:block;font-size:11px;font-weight:700;color:#3d5a4b;text-transform:uppercase;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #dde4e0;border-radius:8px;font:inherit;background:#fafcfb}textarea{min-height:80px;resize:vertical}
.hd input,.hd select{width:auto}
.b{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--g2);color:#fff;font-size:13px}.b.y{background:var(--y)}.b.r{background:#fde4e4;color:#b32121}.b.w{background:#fff;color:#111;border:1px solid #dde4e0}.b.s{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}th{background:var(--l);text-align:left;padding:10px;font-size:12px;text-transform:uppercase;color:var(--g)}td{padding:9px 10px;border-bottom:1px solid #eef2f0;vertical-align:middle}td.e{text-align:center;color:#889;font-style:italic;padding:22px}
.tw{overflow-x:auto;border:1px solid #eef2f0;border-radius:10px}
.hero{background:linear-gradient(120deg,#0e5a35,#1b9a56);color:#fff;border-radius:18px;padding:34px;margin-bottom:20px}.hero h1{margin:10px 0}.pill{background:#ffffff30;padding:6px 14px;border-radius:20px;font-weight:700;font-size:12px}
.st b{display:block;font-size:34px;color:var(--g)}.st small{font-weight:700;color:#556}
.pr{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-bottom:1px solid #eef2f0}.pr .rd{display:flex;gap:22px;margin-left:auto}.pr .rd label{display:flex;gap:6px;align-items:center;text-transform:none;font-size:14px;margin:0;color:#111;cursor:pointer}.pr .rd input{width:auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs a{padding:8px 16px;border-radius:20px;background:#f1f5f3;cursor:pointer;font-weight:700;font-size:13px}.tabs a.on{background:var(--g2);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:70px;background:#fafcfb;border:1px solid #eef2f0;border-radius:6px;padding:4px;font-size:11px}.cal .h{min-height:0;background:var(--l);font-weight:700;text-align:center}.cal .t{border-color:var(--y);background:#fff8e6}.cal span{display:block;background:var(--g2);color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cal span.o{background:#d33}
.tk{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #eef2f0;border-radius:10px;margin-bottom:8px}.tk.ov{border-color:#d33;background:#fff5f5}.tk.dn{opacity:.55}.tk .c{font-weight:800;color:var(--g2);min-width:150px}.tk.ov .c{color:#d33}.tk input{width:auto}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.kg div{background:var(--l);border-radius:10px;padding:12px}
#toast{position:fixed;right:20px;bottom:20px;z-index:99}#toast div{background:#0b3d2a;color:#fff;padding:12px 16px;border-radius:10px;margin-top:8px;box-shadow:0 4px 14px #0004}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50}#md>div{background:#fff;border-radius:14px;padding:24px;width:min(460px,92vw)}
#pa{display:none}
@media(max-width:800px){#sb{position:fixed;z-index:30}#mn{padding:14px}}
@media print{@page{size:A4;margin:14mm}body{display:block;background:#fff}body>*:not(#pa){display:none!important}#pa{display:block!important;font:12px "Times New Roman",serif;color:#000}
#pa .kop{display:flex;gap:14px;align-items:center;text-align:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:12px}#pa .kop img{height:64px}#pa .kop div{flex:1}
#pa table{border:1px solid #000}#pa th,#pa td{border:1px solid #000;padding:4px 6px;color:#000;background:none;font-size:11px;text-transform:none}#pa .ttd{display:flex;justify-content:space-between;margin-top:28px;text-align:center;page-break-inside:avoid}#pa .kg div{border:1px solid #000;background:none;break-inside:avoid}#pa .kg{grid-template-columns:1fr 1fr 1fr}}
</style></head><body>
<aside id="sb"><div class="br"><img id="lg" src="" alt=""><div><b>BIOSFER APP</b><small>Sistem Presensi &amp; Nilai</small></div></div><nav id="nv"></nav>
<div class="ft"><small id="dl">Belum ada tautan pengembang</small><a onclick="info()">🛠 Info Pengembang</a><a onclick="rst()">⟲ Reset Data Aplikasi</a></div></aside>
<div id="mw"><header id="tp"><button id="tg" onclick="$('sb').classList.toggle('c')" title="Buka/tutup sidebar">☰</button><div id="bc"></div><button id="bell" onclick="go('tgs')" title="Pengingat tugas">🔔<i id="bn"></i></button><div class="us"><select id="gs" onchange="S.cur=this.value;sv();hdr()"></select></div></header><main id="mn"></main></div>
<div id="pa"></div><div id="toast"></div><div id="md"><div id="mb"></div></div>
<script>
const $=i=>document.getElementById(i),K='biosfer_v2',HR=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Ahad'],ST=[['H','Hadir'],['S','Sakit'],['I','Izin'],['A','Alfa']],FS=['Fase E (Kelas X)','Fase F (Kelas XI)','Fase F (Kelas XII)'];
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({school:{kkm:75},guru:[],cur:'',jadwal:[],kelas:[],murid:[],cp:{},tp:[],pres:{},nilai:[],sas:{},jurnal:[],poin:[],tugas:[],bobot:{tp:50,sas:30,hdr:20},konv:{on:0,a:100,b:0,c:100,d:50},logo:'',kota:'',kel:null,dev:{nama:'Abdul, S.Pd., Gr.',inst:'SMA Negeri 1 Sebuku',link:''}},S);
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let V={p:'dash',ed:null,ck:'',cf:FS[0],pk:'',pm:'',nk:'',nt:'',rk:'',rm:'',rt:'',tab:'tp',jk:'',pok:'',pom:'',nak:'',nat:'',gk:'',cal:new Date(),tf:0};
const U=()=>Math.random().toString(36).slice(2,9),v=i=>$(i).value.trim(),n0=x=>isNaN(+x)?0:+x;
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kn=i=>(S.kelas.find(k=>k.id==i)||{}).nama||'-',mn=i=>(S.murid.find(m=>m.id==i)||{}).nama||'-',G=()=>S.guru.find(g=>g.id==S.cur)||{nama:'',nip:'',mapel:''};
const mk=k=>S.murid.filter(m=>m.kid==k),today=()=>new Date().toISOString().slice(0,10),fd=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'';
const opt=(a,sel,f,ph)=>`<option value="">${ph}</option>`+a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${E(f(x))}</option>`).join('');
const kO=s=>opt(S.kelas,s,k=>k.nama,'-- Belum ada kelas --'),mO=(k,s)=>opt(mk(k),s,m=>m.nama,'-- Semua murid --');
const card=(t,b,a='')=>`<div class="cd"><div class="hd"><h3>${t}</h3><div>${a}</div></div>${b}</div>`;
const tb=(h,r,c)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.join(''):`<tr><td class="e" colspan="${h.length}">${c||'Belum ada data.'}</td></tr>`}</table></div>`;
const tr=c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`;
const ab=(e,d)=>`<button class="b s y" onclick="${e}">✎ Edit</button> <button class="b s r" onclick="${d}">🗑 Hapus</button>`;
const kota=()=>`<input placeholder="Kota TTD" value="${E(S.kota)}" onchange="S.kota=this.value;sv()" style="width:130px">`;
const pb=f=>`<button class="b y" onclick="${f}">🖨 Cetak PDF (A4)</button>`;
const toast=t=>{const d=document.createElement('div');d.textContent=t;$('toast').append(d);setTimeout(()=>d.remove(),4500)};
const del=(a,i,f)=>{if(confirm('Hapus data ini?')){S[a]=S[a].filter(x=>x.id!=i);sv();f?f():go(V.p)}};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m||'text/plain'}));a.download=n;a.click()};
function pr(title,body){const s=S.school,g=G();$('pa').innerHTML=`<div class="kop">${S.logo?`<img src="${S.logo}">`:''}<div><b>${E(s.pem)}</b><br><b>${E(s.dinas)}</b><br><b style="font-size:16px">${E(s.nama||'BIOSFER APP')}</b></div></div><h3 style="text-align:center;margin:6px 0 12px">${title}</h3>${body}<div class="ttd"><div>Mengetahui,<br>Kepala Sekolah<br><br><br><br><u>${E(s.kepsek)}</u><br>NIP. ${E(s.nip)}</div><div>${E(S.kota)}, ${fd(today())}<br>Guru ${E(g.mapel)}<br><br><br><br><u>${E(g.nama)}</u><br>NIP. ${E(g.nip)}</div></div>`;setTimeout(()=>window.print(),150)}
const NAV=[['dash','🏠','Dashboard'],['sek','🏫','Manajemen Sekolah & Guru'],['jad','📅','Jadwal Pelajaran'],['mur','👥','Data Murid'],['cp','📚','Kelola CP, TP, & ATP'],['pre','✅','Presensi Harian'],['nil','⭐','Input & Kelola Nilai'],['jur','📖','Jurnal Mengajar'],['poi','🏅','Poin Siswa'],['na','🎖','Nilai Akhir'],['kel','🎲','Kelompok Acak'],['tgs','🔔','Pengingat Tugas']];
function go(p,keep){if(!keep){if(p!=V.p)V.ed=null;V.p=p}$('nv').innerHTML=NAV.map(x=>`<a class="${x[0]==V.p?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</a>`).join('');$('bc').innerHTML=`BIOSFER APP • <b>${(NAV.find(x=>x[0]==V.p)||[])[2]}</b>`;$('mn').innerHTML=R[V.p]();hdr();if(innerWidth<800&&!keep)$('sb').classList.add('c')}
function hdr(){$('gs').innerHTML=S.guru.length?S.guru.map(g=>`<option value="${g.id}" ${g.id==S.cur?'selected':''}>${E(g.nama)} (${E(g.mapel)})</option>`).join(''):'<option>Belum ada guru — tambah di menu Sekolah</option>';$('lg').src=S.logo||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44"><text y="34" x="6" font-size="30">🌿</text></svg>');$('dl').innerHTML=S.dev.link?`<a style="color:#9fe" target="_blank" href="${E(S.dev.link)}">${E(S.dev.link)}</a>`:'Belum ada tautan pengembang';const u=S.tugas.filter(t=>!t.done&&new Date(t.dl)-Date.now()<864e5*2).length;$('bn').textContent=u||'';$('bn').style.display=u?'':'none'}
const R={};
/* DASHBOARD */
R.dash=()=>{const h=HR[(new Date().getDay()+6)%7],js=S.jadwal.filter(j=>j.hari==h),up=S.tugas.filter(t=>!t.done).sort((a,b)=>a.dl>b.dl?1:-1).slice(0,5);
return `<div class="hero"><span class="pill">PUSAT KONTROL UTAMA</span><h1>Selamat Datang di BIOSFER APP</h1><p>Sistem administrasi kelas terpadu: presensi harian, nilai TP/ATP &amp; SAS, jurnal mengajar, poin siswa, nilai akhir, kelompok acak dan pengingat tugas — semuanya saling terhubung dan dapat dicetak dalam format A4.</p></div><div class="gr">${[['Total Rombel',S.kelas.length],['Murid Terdaftar',S.murid.length],['Guru / Mapel',S.guru.length],['Agenda Jurnal KBM',S.jurnal.length]].map(x=>`<div class="cd st"><small>${x[0].toUpperCase()}</small><b>${x[1]}</b></div>`).join('')}</div><div class="gr w">${card('Jadwal Hari Ini ('+h+')',tb(['Kelas','Waktu','Mapel'],js.map(j=>tr([kn(j.kid),E(j.jam),E(j.mapel)])),'Tidak ada jadwal hari ini.'))}${card('Tugas Terdekat',up.length?up.map(tk).join(''):'<p class="e">Belum ada pengingat tugas.</p>')}</div>`};
/* SEKOLAH */
R.sek=()=>{const s=S.school,e=S.guru.find(g=>g.id==V.ed)||{};const f=(i,l,x)=>`<div><label>${l}</label><input id="${i}" value="${E(x)}"></div>`;
return card('🏫 Profil Kelembagaan & Atribut Instansi',`<p>Data ini otomatis menjadi kop surat pada semua dokumen cetak.</p><div class="gr"><div><label>Unggah logo sekolah</label><input type="file" accept="image/*" onchange="logo(this)"></div></div><div class="gr w">${f('s1','Pemerintah / Dinas Daerah',s.pem)}${f('s2','Dinas Pendidikan',s.dinas)}${f('s3','Nama Instansi Sekolah',s.nama)}${f('s4','Nama Kepala Sekolah',s.kepsek)}${f('s5','NIP Kepala Sekolah',s.nip)}${f('s6','KKM',s.kkm)}</div><button class="b" onclick="saveSek()">💾 Simpan Atribut</button>`)+
card('👤 Daftar Pengampu Mata Pelajaran (Pengguna)',tb(['Mata Pelajaran','Nama Guru','NIP','Aksi'],S.guru.map(g=>tr([E(g.mapel),E(g.nama),E(g.nip),ab(`V.ed='${g.id}';go('sek',1)`,`del('guru','${g.id}',()=>go('sek',1))`)])),'Belum ada data guru pengampu.')+`<h4>${e.id?'Edit':'Tambah'} Guru</h4><div class="gr">${f('g1','Nama Mapel',e.mapel||'Biologi')}${f('g2','Nama Guru',e.nama)}${f('g3','NIP Guru',e.nip)}</div><button class="b" onclick="saveGuru()">💾 Simpan Guru</button>`)+
card('📦 Backup & Restore Data (JSON)','<button class="b y" onclick="dl(\'BIOSFER_backup_\'+today()+\'.json\',JSON.stringify(S),\'application/json\')">⬇ Ekspor Backup Data</button> <label class="b w" style="display:inline-block;text-transform:none;margin:0">⬆ Impor Restore Data<input type="file" accept=".json" hidden onchange="imp(this)"></label>')};
function saveSek(){S.school={pem:v('s1'),dinas:v('s2'),nama:v('s3'),kepsek:v('s4'),nip:v('s5'),kkm:n0(v('s6'))||75};sv();toast('Atribut tersimpan')}
function logo(i){const r=new FileReader();r.onload=()=>{S.logo=r.result;sv();hdr();toast('Logo disimpan')};r.readAsDataURL(i.files[0])}
function saveGuru(){if(!v('g2'))return toast('Nama guru wajib diisi');const o={mapel:v('g1'),nama:v('g2'),nip:v('g3')};if(V.ed){Object.assign(S.guru.find(g=>g.id==V.ed),o)}else{o.id=U();S.guru.push(o);if(!S.cur)S.cur=o.id}V.ed=null;sv();go('sek',1)}
function imp(i){const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));sv();go(V.p);toast('Data berhasil dipulihkan')}catch(e){alert('File JSON tidak valid')}};r.readAsText(i.files[0])}
function rst(){if(confirm('Semua data aplikasi akan dihapus permanen. Lanjutkan? (Disarankan ekspor backup dulu)')){try{localStorage.removeItem(K)}catch(e){}location.reload()}}
function info(){$('mb').innerHTML=`<h3 style="margin-top:0;color:var(--g)">Info Pengembang</h3><p><b>BIOSFER APP</b> — Sistem Presensi &amp; Nilai. Data tersimpan di peramban perangkat ini (offline).</p><label>Pengembang</label><input id="d1" value="${E(S.dev.nama)}"><label style="margin-top:8px">Instansi</label><input id="d2" value="${E(S.dev.inst)}"><label style="margin-top:8px">Tautan pengembang</label><input id="d3" value="${E(S.dev.link)}" placeholder="https://..."><p style="margin:14px 0 0"><button class="b" onclick="S.dev={nama:v('d1'),inst:v('d2'),link:v('d3')};sv();hdr();$('md').style.display='none'">Simpan</button> <button class="b w" onclick="$('md').style.display='none'">Tutup</button></p>`;$('md').style.display='flex'}
/* JADWAL */
R.jad=()=>{const e=S.jadwal.find(j=>j.id==V.ed)||{},srt=[...S.jadwal].sort((a,b)=>HR.indexOf(a.hari)-HR.indexOf(b.hari)||a.jam.localeCompare(b.jam));
return card('📅 Pengaturan Jadwal Pelajaran',`<div class="gr"><div><label>Rombel kelas</label><select id="j1">${kO(e.kid)}</select></div><div><label>Hari KBM</label><select id="j2">${HR.map(h=>`<option ${h==e.hari?'selected':''}>${h}</option>`).join('')}</select></div><div><label>Waktu / jam ke</label><input id="j3" value="${E(e.jam||'07:30 - 09:00')}"></div><div><label>Mata pelajaran</label><input id="j4" value="${E(e.mapel||G().mapel)}"></div><div><label>Guru pengampu</label><input id="j5" list="gl" value="${E(e.guru||G().nama)}"><datalist id="gl">${S.guru.map(g=>`<option>${E(g.nama)}`).join('')}</datalist></div></div><button class="b" onclick="saveJad()">${e.id?'💾 Perbarui Jadwal':'＋ Tambah ke Sistem'}</button>`)+card('📋 Jadwal Seluruh Rombel (urut Senin–Ahad)',tb(['Kelas','Hari','Waktu','Mapel','Guru','Aksi'],srt.map(j=>tr([kn(j.kid),j.hari,E(j.jam),E(j.mapel),E(j.guru),ab(`V.ed='${j.id}';go('jad',1)`,`del('jadwal','${j.id}')`)])),'Belum ada agenda jadwal pelajaran.'),kota()+pb('prJad()'))};
function saveJad(){if(!v('j1'))return toast('Pilih kelas dulu');const o={kid:v('j1'),hari:v('j2'),jam:v('j3'),mapel:v('j4'),guru:v('j5')};if(V.ed)Object.assign(S.jadwal.find(j=>j.id==V.ed),o);else{o.id=U();S.jadwal.push(o)}V.ed=null;sv();go('jad',1)}
function prJad(){const s=[...S.jadwal].sort((a,b)=>HR.indexOf(a.hari)-HR.indexOf(b.hari)||a.jam.localeCompare(b.jam));pr('JADWAL PELAJARAN',tb(['No','Hari','Waktu','Kelas','Mapel','Guru'],s.map((j,i)=>tr([i+1,j.hari,E(j.jam),kn(j.kid),E(j.mapel),E(j.guru)]))))}
/* MURID */
R.mur=()=>{const e=S.murid.find(m=>m.id==V.ed)||{},k=V.ck||(S.kelas[0]||{}).id||'';V.ck=k;
return `<div class="gr w"><div>${card('＋ Tambah Rombel Kelas','<input id="k1" placeholder="Contoh: X A"><br><br><button class="b" onclick="addKls()">Tambah</button>')}${card((e.id?'✎ Edit':'👥 Tambah')+' Siswa',`<label>Pilih kelas</label><select id="m1">${kO(e.kid||k)}</select><label style="margin-top:8px">Nama siswa</label><input id="m2" value="${E(e.nama)}"><label style="margin-top:8px">NISN (opsional)</label><input id="m3" value="${E(e.nisn)}"><br><br><button class="b" style="width:100%" onclick="saveMur()">💾 Simpan Siswa</button><hr><label>Unggah / impor CSV kolektif (per kelas terpilih di atas)</label><button class="b w" onclick="dl('template_siswa.csv','nama,nisn\\nContoh Siswa,1234567890','text/csv')">⬇ Template CSV</button> <label class="b w" style="display:inline-block;text-transform:none;margin:0">⬆ Unggah CSV<input type="file" accept=".csv" hidden onchange="csvM(this)"></label>`)}</div>

function naRows(){const k=V.nak,b=S.bobot,c=S.konv,kk=S.school.kkm||75;return mk(k).map((m,i)=>{const a=avg(m.id,k),sas=S.sas[m.id],ds=Object.keys(S.pres).filter(x=>x.split('|')[1]==k),tot=ds.filter(x=>S.pres[x][m.id]).length,h=tot?ds.filter(x=>S.pres[x][m.id]=='H').length/tot*100:0,fin=((a||0)*b.tp+(sas||0)*b.sas+h*b.hdr)/((b.tp+b.sas+b.hdr)||1),kv=c.on?c.d+(fin-c.b)*(c.c-c.d)/((c.a-c.b)||1):fin,fv=c.on?kv:fin;return{i:i+1,n:m.nama,a,sas,h,fin,kv:c.on?kv:null,ket:fv>=kk?'Tuntas':'Remedial'}})}
R.na=()=>{const b=S.bobot,c=S.konv,r=naRows(),f=(i,l,x)=>`<div><label>${l}</label><input type="number" id="${i}" value="${x}"></div>`;
return card('🎖 Nilai Akhir',`<p>Kombinasi rata-rata TP, nilai SAS, dan kehadiran menjadi nilai akhir siswa.</p><div class="gr w"><div><label>Rombel kelas</label><select onchange="V.nak=this.value;go('na',1)">${kO(V.nak)}</select></div></div><div class="gr">${f('w1','Bobot sumatif TP (%)',b.tp)}${f('w2','Bobot SAS (%)',b.sas)}${f('w3','Bobot kehadiran (%)',b.hdr)}</div><button class="b" onclick="S.bobot={tp:n0(v('w1')),sas:n0(v('w2')),hdr:n0(v('w3'))};sv();go('na',1)">💾 Simpan Pembobotan</button><div class="cd" style="background:#fffaf0;margin-top:16px"><label><input type="checkbox" style="width:auto" ${c.on?'checked':''} onchange="S.konv.on=this.checked?1:0;sv();go('na',1)"> Aktifkan konversi nilai akhir (normalisasi skor)</label><div class="gr" style="margin-top:10px">${f('v1','NC max',c.a)}${f('v2','NC min',c.b)}${f('v3','NH max',c.c)}${f('v4','NH min',c.d)}</div><button class="b y" onclick="S.konv=Object.assign(S.konv,{a:n0(v('v1')),b:n0(v('v2')),c:n0(v('v3')),d:n0(v('v4'))});sv();go('na',1)">Simpan konversi</button></div>`+naT(r),kota()+pb('prNA()'))};
const f1=x=>x==null?'-':(+x).toFixed(1),naT=r=>tb(['No','Nama murid','Rata-rata TP','Nilai SAS','Kehadiran (%)','Nilai akhir murni','Nilai konversi','Ketentuan'],r.map(x=>tr([x.i,E(x.n),f1(x.a),x.sas??'-',f1(x.h),f1(x.fin),f1(x.kv),x.ket])),'Pilih kelas untuk menghitung nilai akhir.');
function prNA(){pr('DAFTAR NILAI AKHIR — KELAS '+kn(V.nak)+` (KKM ${S.school.kkm||75})`,naT(naRows()))}
/* KELOMPOK */
R.kel=()=>{const g=S.kel;return card('🎲 Generate Kelompok Acak',`<div class="gr"><div><label>Judul pembagian kelompok</label><input id="q1" placeholder="Diskusi Bab Hukum Mendel" value="${E(g&&g.judul)}"></div><div><label>Kelas</label><select id="q2" onchange="V.gk=this.value;go('kel',1)">${kO(V.gk)}</select></div><div><label>Mode</label><select id="q3"><option value="k">Berdasarkan jumlah kelompok</option><option value="a">Berdasarkan jumlah anggota per kelompok</option></select></div><div><label>Jumlah</label><input type="number" min="1" id="q4" value="4"></div></div><button class="b" onclick="genK()">🎲 Acak Kelompok</button>`)+(g?card(E(g.judul)+' — Kelas '+kn(g.kid),`<div class="kg">${g.g.map((x,i)=>`<div><b>Kelompok ${i+1}</b><ol>${x.map(m=>`<li>${E(mn(m))}</li>`).join('')}</ol></div>`).join('')}</div>`,kota()+pb('prKel()')):'')};
function genK(){const k=v('q2'),ms=mk(k).map(m=>m.id),n=Math.max(1,+v('q4')||1);if(!ms.length)return toast('Kelas belum punya data murid');for(let i=ms.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ms[i],ms[j]]=[ms[j],ms[i]]}const c=v('q3')=='k'?Math.min(n,ms.length):Math.ceil(ms.length/n),g=Array.from({length:c},()=>[]);ms.forEach((m,i)=>g[i%c].push(m));S.kel={judul:v('q1')||'Pembagian Kelompok',kid:k,g};sv();go('kel',1)}
function prKel(){const g=S.kel;pr(E(g.judul).toUpperCase()+' — KELAS '+kn(g.kid),`<div class="kg">${g.g.map((x,i)=>`<div><b>Kelompok ${i+1}</b><ol>${x.map(m=>`<li>${E(mn(m))}</li>`).join('')}</ol></div>`).join('')}</div>`)}
/* TUGAS */
const cdn=d=>{let t=new Date(d)-Date.now();if(t<0)return'⏰ Terlambat '+cdn2(-t);return '⏳ '+cdn2(t)},cdn2=t=>{const s=Math.floor(t/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'h ':'')+h+'j '+m+'m '+s%60+'d'};
const tk=t=>`<div class="tk ${t.done?'dn':new Date(t.dl)<Date.now()?'ov':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tgl('${t.id}')"><div style="flex:1"><b>${E(t.judul)}</b><br><small>${t.kid?'Kelas '+kn(t.kid)+' • ':''}${new Date(t.dl).toLocaleString('id-ID')} ${E(t.cat)}</small></div><span class="c" ${t.done?'':`data-dl="${t.dl}"`}>${t.done?'✔ Selesai':cdn(t.dl)}</span>${V.p=='tgs'?ab(`V.ed='${t.id}';go('tgs',1)`,`del('tugas','${t.id}')`):''}</div>`;
R.tgs=()=>{const e=S.tugas.find(t=>t.id==V.ed)||{},c=V.cal,y=c.getFullYear(),mo=c.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();let cells=HR.map(h=>`<div class="h">${h.slice(0,3)}</div>`).join('')+'<div style="visibility:hidden"></div>'.repeat(first);
for(let d=1;d<=dim;d++){const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="${ds==today()?'t':''}"><b>${d}</b>${S.tugas.filter(t=>t.dl.slice(0,10)==ds).map(t=>`<span class="${!t.done&&new Date(t.dl)<Date.now()?'o':''}" title="${E(t.judul)}">${E(t.judul)}</span>`).join('')}</div>`}
const l=[...S.tugas].sort((a,b)=>a.done-b.done||(a.dl>b.dl?1:-1));
return card(e.id?'✎ Edit Catatan Penugasan':'🔔 Catatan / Pengingat Penugasan',`<div class="gr w"><div><label>Judul tugas</label><input id="t1" value="${E(e.judul)}"></div><div><label>Kelas (opsional)</label><select id="t2">${kO(e.kid||'').replace('-- Belum ada kelas --','-- Semua --')}</select></div><div><label>Deadline</label><input type="datetime-local" id="t3" value="${e.dl||''}"></div><div><label>Catatan</label><input id="t4" value="${E(e.cat)}"></div></div><button class="b" onclick="saveT()">💾 Simpan Pengingat</button> <button class="b w" onclick="Notification&&Notification.requestPermission()">Aktifkan notifikasi browser</button>`)+card('Daftar Tugas & Hitung Mundur',l.length?l.map(tk).join(''):'<p style="color:#889">Belum ada tugas.</p>',kota()+pb('prT()'))+card('🗓 Tampilan Kalender — '+c.toLocaleDateString('id-ID',{month:'long',year:'numeric'}),`<div class="cal">${cells}</div>`,`<button class="b w s" onclick="V.cal=new Date(${y},${mo-1},1);go('tgs',1)">◀</button><button class="b w s" onclick="V.cal=new Date(${y},${mo+1},1);go('tgs',1)">▶</button>`)};
function saveT(){if(!v('t1')||!v('t3'))return toast('Isi judul dan deadline');const o={judul:v('t1'),kid:v('t2'),dl:v('t3'),cat:v('t4')};if(V.ed)Object.assign(S.tugas.find(t=>t.id==V.ed),o,{ntf:0});else{o.id=U();o.done=0;S.tugas.push(o)}V.ed=null;sv();go('tgs',1)}
function tgl(i){const t=S.tugas.find(x=>x.id==i);t.done=!t.done;sv();go(V.p,1)}
function prT(){pr('DAFTAR PENUGASAN & DEADLINE',tb(['No','Tugas','Kelas','Deadline','Catatan','Status'],S.tugas.map((t,i)=>tr([i+1,E(t.judul),t.kid?kn(t.kid):'Semua',new Date(t.dl).toLocaleString('id-ID'),E(t.cat),t.done?'Selesai':'Belum']))))}
setInterval(()=>document.querySelectorAll('[data-dl]').forEach(e=>e.textContent=cdn(e.dataset.dl)),1000);
function ntf(){S.tugas.forEach(t=>{const d=new Date(t.dl)-Date.now();if(!t.done&&!t.ntf&&d<864e5){t.ntf=1;sv();toast('🔔 Deadline dekat: '+t.judul+' ('+cdn2(Math.abs(d))+')');try{if(Notification.permission=='granted')new Notification('BIOSFER: '+t.judul,{body:'Deadline '+new Date(t.dl).toLocaleString('id-ID')})}catch(e){}}});hdr()}
if(!S.cur&&S.guru[0])S.cur=S.guru[0].id;go('dash');ntf();setInterval(ntf,60000);
</script></body></html>
